# Local development services. Redis is used as a cache only, so no
# persistence is configured: losing it costs cache warmth, never data.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
